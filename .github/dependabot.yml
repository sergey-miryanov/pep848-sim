version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: daily
    time: "02:00"
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7

- package-ecosystem: github-actions
  # "/" covers .github/workflows only; the setup action lives elsewhere.
  directories: ["/", "/.github/actions/*"]
  schedule:
    interval: daily
    time: "02:00"
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7

- package-ecosystem: pre-commit
  directory: "/"
  schedule:
    interval: daily
    time: "02:00"
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
