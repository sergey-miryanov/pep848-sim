version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: daily
    time: "02:00"
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7

- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
    time: "02:00"
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7

- package-ecosystem: github-actions
  # "/" covers .github/workflows only; the setup action lives elsewhere.
  directories: ["/", "/.github/actions/*"]
  schedule:
    interval: daily
    time: "02:00"
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7

- package-ecosystem: pre-commit
  directory: "/"
  schedule:
    interval: daily
    time: "02:00"
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
  ignore:
    # crate-ci/typos also tags its other crates (varcon-core-v5.0.7, ...),
    # and Dependabot reads those as typos releases. typos itself is at 1.x.
    - dependency-name: "https://github.com/crate-ci/typos"
      versions: [">= 2"]
