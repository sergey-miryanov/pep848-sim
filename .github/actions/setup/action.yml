name: Set up Python, Poetry and Node
description: Set up Pyodide's Python, install Poetry and the project's dependencies, and install Node, tsc and Pyodide, after a checkout

runs:
  using: composite
  steps:
    # Pyodide's Python: see CONTRIBUTING.md.
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.14"

    - name: Install Poetry
      run: pipx install poetry
      shell: bash

    - name: Install dependencies
      run: poetry install --no-interaction
      shell: bash

    # Node runs tsc over the site's JavaScript, the widget's tests, and Pyodide
    # for the check of the pinned digests.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"

    - name: Install tsc and Pyodide
      run: npm ci
      shell: bash
