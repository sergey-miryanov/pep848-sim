name: Set up Python, Poetry and Node
description: Set up Pyodide's Python, install Poetry and the project's dependencies, and install Node and tsc, after a checkout

runs:
  using: composite
  steps:
    # Pyodide's Python: see CONTRIBUTING.md.
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"

    - name: Install Poetry
      run: pipx install poetry
      shell: bash

    - name: Install dependencies
      run: poetry install --no-interaction
      shell: bash

    # Node runs tsc, which checks the site's JavaScript.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"

    - name: Install tsc
      run: npm ci
      shell: bash
