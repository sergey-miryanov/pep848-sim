name: Set up Python and Poetry
description: Set up Pyodide's Python, install Poetry and the project's dependencies, after a checkout

runs:
  using: composite
  steps:
    # Pyodide's Python: see CONTRIBUTING.md.
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"

    - name: Install Poetry
      run: pipx install poetry
      shell: bash

    - name: Install dependencies
      run: poetry install --no-interaction
      shell: bash
