name: Deploy

on:
  push:
    branches: [main]

# One deployment at a time, and never cancel one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Pushes the site to the gh-pages branch, which GitHub Pages serves.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      # A failing check deploys nothing.
      - name: Check
        run: poetry run just check

      - name: Assemble the site
        run: poetry run just site

      # The pull requests' previews live in pr-preview/ on the same branch.
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
