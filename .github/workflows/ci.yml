name: CI

on:
  pull_request:
    branches: [main]
  # Every commit on main uploads coverage too, so Codecov has a base to
  # compare a pull request with.
  push:
    branches: [main]

# A new push to a pull request cancels its older run. Each push to main runs
# in a group of its own, so every commit there uploads its coverage.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each recipe `just check` runs is a job of its own, named for the recipe, so
  # the checks list names the recipe that failed, and one failing leaves the
  # others to finish. tests/test_ci.py keeps the list in step with `just check`.
  recipe:
    name: ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        recipe: [lint, typecheck, test, check-ts, test-js, test-pyodide]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Run the recipe
        run: poetry run just ${{ matrix.recipe }}

      - name: Upload coverage to Codecov
        if: always() && matrix.recipe == 'test'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  # Branch protection requires this one check. It runs when a recipe's job
  # fails too, since a skipped job counts as passed, and it fails unless every
  # recipe's job passed.
  check:
    if: always()
    needs: recipe
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check that every recipe passed
        env:
          RESULT: ${{ needs.recipe.result }}
        run: test "$RESULT" = success
