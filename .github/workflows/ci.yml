name: CI

on:
  pull_request:
    branches: [main]
  # Every commit on main uploads coverage too, so Codecov has a base to
  # compare a pull request with.
  push:
    branches: [main]

# A new push to a pull request cancels its older run. Each push to main runs
# in a group of its own, so every commit there uploads its coverage.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Check
        run: poetry run just check

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
