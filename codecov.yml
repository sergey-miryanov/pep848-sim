# https://docs.codecov.com/docs/codecov-yaml
codecov:
  require_ci_to_pass: true

coverage:
  # Rounded as coverage.py rounds the total it holds to fail_under, so the
  # project status and the gate in pyproject.toml agree.
  precision: 2
  round: nearest
  range: "90...100"
  status:
    project:
      default:
        target: 99%
    patch:
      default:
        target: 90%

comment:
  layout: "reach, diff, flags, files"
  require_changes: true
