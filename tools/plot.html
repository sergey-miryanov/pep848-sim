<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presets against their benchmarks</title>
  <!-- A dev page, which `just plot` serves from the repo's root: it takes the
       site's theme, and nothing in site/ or sim.zip takes it. -->
  <script src="../site/theme.js"></script>
  <link rel="stylesheet" href="../site/theme.css">
  <style>
    /* The preset's run takes the nursery's teal, the benchmark's workers the
       muted gray. */
    :root { --run: var(--nursery); --workers: var(--text-muted); }
    body {
      margin: 0 auto; padding: 16px; max-width: 1400px;
      font: 14px/1.4 system-ui, sans-serif;
    }
    nav { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
    select { font: inherit; }
    .legend { display: flex; flex-wrap: wrap; gap: 16px; color: var(--text-secondary); }
    .legend span::before {
      content: ""; display: inline-block; width: 24px; margin-right: 6px;
      vertical-align: middle; border-top: 1px solid var(--workers);
    }
    .legend .run::before { border-top: 3px solid var(--run); }
    .legend .workers::before { opacity: 0.6; }
    h2 { font-size: 15px; margin: 24px 0 4px; color: var(--text-primary); }
    .note { margin: 0 0 8px; max-width: 70ch; color: var(--text-secondary); }
    /* Four columns, one to a series, so that a series lines up down the page. */
    .row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 16px; }
    .row.whole { grid-template-columns: minmax(0, 1fr); }
    @media (max-width: 900px) { .row { grid-template-columns: minmax(0, 1fr); } }
    figure { margin: 0; min-width: 0; }
    figcaption { font-size: 12px; color: var(--text-secondary); }
  </style>
</head>
<body>
  <nav>
    <label>Preset <select id="preset"></select></label>
    <label>Collector <select id="collector"></select></label>
    <button class="theme-switch" type="button"></button>
  </nav>
  <p class="legend">
    <span class="workers" id="workers">the benchmark's workers</span>
    <span class="run">the preset's run</span>
  </p>
  <main id="panels"><p>Loading plot.json, which <code>just plot</code> writes.</p></main>
  <script type="module" src="plot.js"></script>
</body>
</html>
