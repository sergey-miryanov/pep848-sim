[project]
name = "pep848-sim"
version = "0.1.0"
description = "An in-browser explainer for the incremental cycle collector proposed in PEP 848"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sergey Miryanov" }]
requires-python = ">=3.14"
dependencies = []

[project.urls]
Homepage = "https://sergey-miryanov.github.io/pep848-sim/"
Repository = "https://github.com/sergey-miryanov/pep848-sim"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "hypothesis (>=6.170.5,<7.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pyrefly (>=1.4.0,<2.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "rust-just (>=1.59.0,<2.0.0)"
]

[tool.ruff]
target-version = "py314"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "tools"]

[tool.pyrefly]
preset = "strict"
python-version = "3.14"
project-includes = ["src", "tests", "tools"]
search-path = ["src", "tools", "tests"]

[tool.pytest]
strict = true
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = ["--cov=pep848_sim", "--cov-report=term", "--cov-report=xml"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 99
precision = 2
show_missing = true

[tool.typos.default]
# A playground link holds its request in base64url, whose letters read as typos.
extend-ignore-re = ['playground\.request=[\w-]+']
